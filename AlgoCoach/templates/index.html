<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>algocoach — terminal</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="terminal">

    <div class="titlebar">
      <div class="dots">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <div class="titlebar-label">algocoach — dsa@instructor: ~</div>
      <button id="reset-btn" class="reset-btn hidden" title="restart session">↻</button>
    </div>

    <div class="term-body">

      <div id="intro-screen">
        <pre class="ascii">
   _   _           ___              _
  /_\ | |__ _ ___ / __|___  __ _ __| |_
 / _ \| / _\` / _ \ (__/ _ \/ _\` / _| ' \
/_/ \_\_\__, \___/\___\___/\__,_\__|_||_|
        |___/
        </pre>
        <p class="boot-line">DSA-only instructor. no small talk. no exceptions.</p>
        <button id="start-btn" class="run-btn">$ run session.start()</button>
        <p id="setup-error" class="error"></p>
      </div>

      <div id="chat-screen" class="hidden">
        <div id="messages" class="messages"></div>
        <div class="input-line">
          <span class="prompt">you@dsa:~$</span>
          <input type="text" id="message-input" autocomplete="off" spellcheck="false" placeholder="ask a dsa question...">
          <span class="cursor">▌</span>
        </div>
      </div>

    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
